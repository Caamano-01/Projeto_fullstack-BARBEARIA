<!DOCTYPE html>
<html lang="pt-br" class="home-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Barbearia</title>
    <link rel="icon" href="img/barbershop.png" type="image/png">
    <link rel="stylesheet" href="../../CSS/style-user.css">
</head>
<body class="home">
    <!-- IMAGENS DO CARROUSEL DE FUNDO -->
     <div class="background-carousel">
        <div class="slide active" style="background-image: url('../../img/fundo_home.jpg');"></div>
        <div class="slide" style="background-image: url('../../img/fundo_home-2.jpg');"></div>
        <div class="slide" style="background-image: url('../../img/fundo_home-3.jpg');"></div>
     </div>

    <!-- CABEÇALHO -->
    <header>
        <div class="logo-container">
            <img src="../../img/Logo_escuro.png" alt="Logo Senai Barbearia">
        </div>
        
        <nav>
            <ul>
                <li><a href="../user/home.html" class="active">Início</a></li>
                <li><a href="../user/servicos.html">Serviços</a></li>
                <li><a href="../user/profissionais.html">Profissionais</a></li>
                <li><a href="../user/meus-horarios.html">Meus horários</a></li>
                <li><a href="../user/agendar.html">Agendar</a></li>
                <li><a href="../user/localizacao.html">Localização</a></li>
                <li><a href="../user/perfil.html">Perfil</a></li>
                <li><a class="btn-sair" href="../../index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <!-- SEÇÃO DE INÍCIO-->
    <section class="hero">
        <div class="hero-content">
            <h1>Senai Barbearia</h1>
            <p>A melhor barbearia de Porto Alegre!</p>
            <a href="../user/agendar.html" class="btn-agendar">Agendar</a>
        </div>
    </section>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2025 Senai Barbearia. Todos os direitos reservados.</p>
    </footer>

    <script>
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            // Remove a classe ativa da imagem atual
            slides[currentSlide].classList.remove('active');
            
            // Calcula o próximo índice (volta ao zero se chegar ao fim)
            currentSlide = (currentSlide + 1) % slides.length;
            
            // Adiciona a classe ativa na nova imagem
            slides[currentSlide].classList.add('active');
        }

        // Define o intervalo de 5 segundos (5000 milissegundos)
        setInterval(nextSlide, 5000);
    </script>
</body>
</html>
