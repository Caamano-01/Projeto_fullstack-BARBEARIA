<!DOCTYPE html>
<html lang="pt-br" class="home-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Barbearia</title>
    <link rel="icon" href="../../img/barbershop.png" type="image/png">
    <link rel="stylesheet" href="../../CSS/style-user.css">
</head>
<body>
    <!-- CABEÇALHO -->
    <header>
        <div class="logo-container">
            <img src="../../img/Logo_escuro.png" alt="Logo Senai Barbearia">
        </div>
        
        <nav>
            <ul>
                <li><a href="../user/home.html" class="active">Início</a></li>
                <li><a href="../user/servicos.html">Serviços</a></li>
                <li><a href="../user/profissionais.html">Profissionais</a></li>
                <li><a href="../user/meus-horarios.html">Meus horários</a></li>
                <li><a href="../user/agendar.html">Agendar</a></li>
                <li><a href="../user/localizacao.html">Localização</a></li>
                <li><a class="btn-sair" href="../../index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="container-horarios">
        <h1 class="titulo">Meus agendamentos</h1>
        
        <div id="lista-agendamentos">
            <p>Carregando seus horários...</p>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2025 Senai Barbearia. Todos os direitos reservados.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('lista-agendamentos');

            function carregarHorarios() {
                fetch('../../backend/routes/horarios-users.php')
                    .then(response => {
                        // Se o PHP der erro (404, 500, etc), captura o texto para debug
                        if (!response.ok) {
                            return response.text().then(text => { throw new Error(text) });
                        }
                        return response.json();
                    })
                    .then(dados => {
                        console.log("Dados recebidos:", dados);
                        
                        // Limpa o "Carregando..."
                        container.innerHTML = ''; 

                        // Verifica se o PHP retornou um erro de sessão ou lista vazia
                        if (dados.erro) {
                            container.innerHTML = `<p class="mensagem-erro">${dados.erro}</p>`;
                            return;
                        }

                        if (dados.length === 0) {
                            container.innerHTML = '<p class="mensagem-vazia">Você ainda não possui agendamentos.</p>';
                            return;
                        }

                        dados.forEach(item => {
                            const podeCancelar = item.status === 'pendente' || item.status === 'confirmado';
                            const botaoCancelar = podeCancelar ? 
                                `<button class="btn-cancelar" onclick="cancelarAgendamento(${item.id})">Cancelar</button>` : '';

                            container.innerHTML += `
                                <div class="card-agendamento">
                                    <div class="detalhes-hor">
                                        <p><strong>Serviço:</strong> ${item.servico}</p>
                                        <p><strong>Profissional:</strong> ${item.profissional}</p>
                                        <p><strong>Data:</strong> ${item.data}</p>
                                        <p><strong>Hora:</strong> ${item.hora}</p>
                                    </div>
                                    <div class="status-container">
                                        <span class="status-badge status-${item.status}">${item.status.toUpperCase()}</span>
                                        ${botaoCancelar}
                                    </div>
                                </div>`;
                        });
                    })
                    .catch(err => {
                        console.error("Erro detalhado:", err.message);
                        container.innerHTML = '<p>Erro ao carregar agendamentos. Verifique o console.</p>';
                    });
            }

            // Função para cancelar
            window.cancelarAgendamento = function(id) {
                if (confirm('Tem certeza que deseja cancelar este agendamento?')) {
                    fetch('../../backend/routes/cancelar-agendamento.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded'
                        },
                        body: `id=${id}`
                    })
                    .then(res => res.json())
                    .then(dados => {
                        if (dados.sucesso) {
                            alert('Agendamento cancelado com sucesso!');
                            carregarHorarios();
                        } else {
                            alert('Erro: ' + (dados.erro || 'Falha ao cancelar'));
                        }
                    })
                    .catch(err => {
                        console.error('Erro na requisição:', err);
                        alert('Erro ao processar o cancelamento.');
                    });
                }
            };

            carregarHorarios();
        });
    </script>
</body>
</html>
