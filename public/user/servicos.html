        <div class="titulo">Serviços</div>

        <div id="lista-servicos">

        </div>
    </div>

    <!-- RODAPÉ -->
    <footer>

    </footer>

    <script>
        async function carregarServicos() {
            const container = document.getElementById("lista-servicos");

            try {
                const resposta = await fetch("../../backend/routes/servicos.php");
                const json = await resposta.json();

                if (!json.success) {
                    container.innerHTML = "<p>Erro ao carregar serviços.</p>";
                    return;
                }

                const servicos = json.data;

                if (servicos.length === 0) {
                    container.innerHTML = "<p>Nenhum serviço disponível.</p>";
                    return;
                }

                container.innerHTML = "";

                servicos.forEach(s => {
                    container.innerHTML += `
                        <div class="card">
                            <div class="service-details">
                                <h4>${s.nome}</h4>
                                <p class="service-description">${s.descricao || 'Serviço profissional de alta qualidade.'}</p>
                            </div>
                            
                            <div class="service-info">
                                <span class="preco">R$ ${parseFloat(s.preco).toFixed(2).replace('.', ',')}</span>
                                <span class="tempo">${s.duracao_minutos} min</span>
                                <a href="../user/agendar.html" class="btn-agendar-card">Agendar</a>
                            </div>
                        </div>
                    `;
                });

            } catch (erro) {
                container.innerHTML = "<p>Erro na comunicação com o servidor.</p>";
            }
        }

        carregarServicos();
    </script>
</body>
</html>
