<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Barbearia</title>
    <!-- LINKS -->
     <link rel="stylesheet" href="../../CSS/style.css">
</head>
<body class="index">
    <div class="container-login">
        <!--------------------- Esquerda da página ---------------------->
        <div class="esquerda-conteiner">
            <!-- LOGO -->
            <div class="logo">
                <img src="../../img/Logo_escuro.png" alt="Logo Senai Barbearia">
            </div>

            <hr class="divider">

            <!-- TEXTO BEM VINDO -->
            <p class="bemvindo-text">
                Bem vindo ao Senai Barbearia,<br>
                faça login ou cadastre-se para<br>
                acessar o site.
            </p>
        </div>

        <!--------------------- Direita da página ----------------------->
        <div class="direita-container">
            <h1>Criar conta</h1>
            <!-- FORMULÁRIO DE LOGIN-->
           <form action="../../backend/routes/registro.php" method="post">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input style="margin-bottom: 10px;" type="text" id="nome" name="nome" placeholder="Ex.: Marcos" required>

                    <br>

                    <label for="">Telefone:</label>
                    <input style="margin-bottom: 10px;" type="text" id="telefone" name="telefone" placeholder="51991919191" required>

                    <br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Ex.: marcos@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha:</label>

                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" required>
                        <svg class="eye-icon" ...></svg>
                    </div>
                </div>

                <button type="submit" class="btn-login">Criar conta</button>
            </form>
            <!-- TEXTO PARA ACESSAR CADASTRO -->
            <p class="footer-form">
                Já tem uma conta? <a href="../../index.html" class="link-pagina">login</a>
            </p>
        </div>
    </div>
</body>
</html>
