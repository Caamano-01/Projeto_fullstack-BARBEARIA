<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Barbearia</title>
    <link rel="icon" href="img/barbershop.png" type="image/png">
    <!-- LINKS -->
     <link rel="stylesheet" href="../../CSS/style-user.css">
</head>
<body class="index">
    <div class="container-login">
        <!--------------------- Esquerda da página ---------------------->
        <div class="esquerda-conteiner">
            <!-- LOGO -->
            <div class="logo">
                <img src="../../img/Logo_escuro.png" alt="Logo Senai Barbearia">
            </div>

            <hr class="divider">

            <!-- TEXTO BEM VINDO -->
            <p class="bemvindo-text">
                Bem vindo ao Senai Barbearia,<br>
                faça login ou cadastre-se para<br>
                acessar o site.
            </p>
        </div>

        <!--------------------- Direita da página ----------------------->
        <div class="direita-container">
            <h1>Criar conta</h1>
            <!-- FORMULÁRIO DE LOGIN-->
           <form action="../../backend/routes/registro.php" method="post">
                <div class="form-group">
                    <label for="nome">Nome:</label>
                    <input style="margin-bottom: 10px;" type="text" id="nome" name="nome" placeholder="Ex.: Marcos" required>

                    <br>

                    <label for="telefone">Telefone:</label>
                    <input style="margin-bottom: 10px;" type="text" id="telefone" name="telefone" placeholder="(51) 99999-9999" maxlength="15" required>

                    <br>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Ex.: marcos@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha:</label>

                    <div class="input-wrapper">
                        <input type="password" id="password" name="password">
                        <!-- ICON DE OLHO PARA VER SENHA -->
                        <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                </div>

                <button type="submit" class="btn-login">Criar conta</button>
            </form>
            <!-- TEXTO PARA ACESSAR CADASTRO -->
            <p class="footer-form">
                Já tem uma conta? <a href="../../index.html" class="link-pagina">login</a>
            </p>
        </div>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.querySelector('.eye-icon');
        const telefoneInput = document.getElementById('telefone');
        const form = document.querySelector('form');

        // MOSTRAR/ESCONDER SENHA
        eyeIcon.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.style.color = '#007bff';
            } else {
                passwordInput.type = 'password';
                eyeIcon.style.color = 'currentColor';
            }
        });

        // MÁSCARA DE TELEFONE
        telefoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, "");
            if (value.length > 0) value = "(" + value;
            if (value.length > 3) value = value.slice(0, 3) + ") " + value.slice(3);
            if (value.length > 10) value = value.slice(0, 10) + "-" + value.slice(10);
            e.target.value = value;
        });

        // VALIDAÇÃO ANTES DE ENVIAR
        form.addEventListener('submit', function(event) {
            const telValue = telefoneInput.value;
            
            // Verifica se o telefone tem o tamanho correto (15 caracteres)
            if (telValue.length < 15) {
                event.preventDefault(); // Impede o envio do formulário
                alert('Por favor, insira o telefone completo com DDD e 9 dígitos: (XX) XXXXX-XXXX');
                telefoneInput.focus(); // Coloca o cursor no campo de telefone
            }
        });
    </script>
</body>
</html>
