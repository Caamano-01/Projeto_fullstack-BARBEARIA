<!DOCTYPE html>
<html lang="pt-br" class="home-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Barbearia</title>
    <link rel="icon" href="../../img/barbershop.png" type="image/png">
    <link rel="stylesheet" href="../../CSS/style-user.css">
</head>
<body>
    <!-- CABEÇALHO -->
    <header>
        <div class="logo-container">
            <img src="../../img/Logo_escuro.png" alt="Logo Senai Barbearia">
        </div>
        
        <nav>
            <ul>
                <li><a href="../user/home.html" class="active">Início</a></li>
                <li><a href="../user/servicos.html">Serviços</a></li>
                <li><a href="../user/profissionais.html">Profissionais</a></li>
                <li><a href="../user/meus-horarios.html">Meus horários</a></li>
                <li><a href="../user/agendar.html">Agendar</a></li>
                <li><a href="../user/localizacao.html">Localização</a></li>
                <li><a class="btn-sair" href="../../index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="container-horarios">
        <h2 class="titulo">Reserve seu horário</h2>

        <div class="agendar-container">
                <h2>Agende seu Horário</h2>
                
                <form action="../../backend/routes/fazer_agendamento.php" method="POST">
                    <div class="form-group">
                        <label>Escolha o Serviço:</label>
                        <select name="servico_id" id="servico_id" class="form-control" required onchange="carregarProfissionais()">
                            <option value="">Selecione...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Escolha o Profissional:</label>
                        <select name="profissional_id" id="profissional_id" class="form-control" required onchange="resetData()">
                            <option value="">Primeiro escolha o serviço</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Data:</label>
                        <input type="date" name="data" id="data_agendamento" class="form-control" required onchange="carregarHorarios()">
                    </div>

                    <div id="secao-horarios" style="display:none;">
                        <label>Horários Disponíveis:</label>
                        <div id="lista-horarios" class="grid-horarios"></div>
                    </div>

                    <input type="hidden" name="hora" id="hora_selecionada" required>

                    <div id="resumo-card">
                        <p id="resumo-texto"></p>
                    </div>

                    <button type="submit" class="btn-agendar">Confirmar Agendamento</button>
                </form>
            </div>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2025 Senai Barbearia. Todos os direitos reservados.</p>
    </footer>

    <script>
        const API_URL = '../../backend/routes/obter_dados.php';

        document.addEventListener('DOMContentLoaded', () => {
            carregarServicos();
            // Define a data mínima como hoje
            document.getElementById('data_agendamento').min = new Date().toISOString().split('T')[0];
        });

        function carregarServicos() {
            fetch(`${API_URL}?acao=servicos`)
                .then(res => res.json())
                .then(dados => {
                    const select = document.getElementById('servico_id');
                    select.innerHTML = '<option value="">Selecione um serviço</option>';

                    // Verifica se 'dados' é de fato uma lista (Array)
                    if (Array.isArray(dados)) {
                        dados.forEach(s => {
                            const option = document.createElement('option');
                            option.value = s.id;
                            option.textContent = `${s.nome} - R$ ${parseFloat(s.preco).toFixed(2)}`;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(err => console.error("Erro ao carregar serviços:", err));
        }

        function carregarProfissionais() {
            const servicoId = document.getElementById('servico_id').value;
            const proSelect = document.getElementById('profissional_id');

            // Se não houver serviço selecionado, limpa o select de profissionais
            if (!servicoId) {
                proSelect.innerHTML = '<option value="">Selecione um serviço primeiro</option>';
                return;
            }

            proSelect.innerHTML = '<option value="">Carregando...</option>';

            fetch(`${API_URL}?acao=profissionais&servico_id=${servicoId}`)
                .then(res => res.json())
                .then(dados => {
                    proSelect.innerHTML = '<option value="">Selecione o profissional</option>';
                    
                    if (Array.isArray(dados) && dados.length > 0) {
                        dados.forEach(p => {
                            let option = document.createElement('option');
                            option.value = p.id;
                            option.textContent = p.nome;
                            proSelect.appendChild(option);
                        });
                    } else {
                        proSelect.innerHTML = '<option value="">Nenhum profissional disponível</option>';
                    }
                })
                .catch(erro => {
                    console.error("Erro ao carregar profissionais:", erro);
                    proSelect.innerHTML = '<option value="">Erro ao carregar</option>';
                });
        }

        function carregarHorarios() {
            const data = document.getElementById('data_agendamento').value;
            const profId = document.getElementById('profissional_id').value;
            const listaContainer = document.getElementById('lista-horarios');

            if (!data || !profId) return;

            document.getElementById('secao-horarios').style.display = 'block';
            listaContainer.innerHTML = '<p>Carregando horários...</p>';

            // Busca bloqueios e agendamentos simultaneamente
            Promise.all([
                fetch(`../../backend/routes/listar-bloqueios.php?data=${data}&profissional_id=${profId}`).then(r => r.json()),
                fetch(`../../backend/routes/agendamentos.php?data=${data}`).then(r => r.json())
            ])
            .then(([bloqueios, agendados]) => {
                listaContainer.innerHTML = '';
                
                // Defina aqui sua grade de horários padrão
                const gradeHorarios = ["09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00",
                "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00"];

                gradeHorarios.forEach(hora => {
                    const horaFormatada = hora + ":00";
                    
                    // Verifica se está agendado
                    const estaAgendado = agendados.some(a => a.hora === horaFormatada);
                    
                    // Verifica se está bloqueado pelo ADM (entre hora_inicio e hora_fim)
                    const estaBloqueado = bloqueios.some(b => {
                        return b.profissional_id == profId && 
                            b.data === data && 
                            (horaFormatada >= b.hora_inicio && horaFormatada <= b.hora_fim);
                    });

                    const div = document.createElement('div');
                    div.className = 'slot-hora';
                    div.textContent = hora;

                    if (estaAgendado || estaBloqueado) {
                        div.classList.add('bloqueado');
                        div.title = estaBloqueado ? "Bloqueado pelo Admin" : "Já reservado";
                    } else {
                        div.onclick = () => selecionarHora(hora, div);
                    }
                    
                    listaContainer.appendChild(div);
                });
            })
            .catch(err => {
                console.error("Erro:", err);
                listaContainer.innerHTML = '<p>Erro ao carregar horários.</p>';
            });
        }

        function selecionarHora(hora, elemento) {
            document.getElementById('hora_selecionada').value = hora;
            document.querySelectorAll('.slot-hora').forEach(b => b.classList.remove('selecionado'));
            elemento.classList.add('selecionado');
            
            const servicoNome = document.querySelector('#servico_id option:checked').text;
            const resumo = document.getElementById('resumo-card');
            document.getElementById('resumo-texto').innerHTML = `<strong>Resumo:</strong> ${servicoNome} às ${hora}`;
            resumo.style.display = 'block';
        }

        function resetData() {
            document.getElementById('data_agendamento').value = '';
            document.getElementById('secao-horarios').style.display = 'none';
            document.getElementById('resumo-card').style.display = 'none';
        }
    </script>
</body>
</html>
