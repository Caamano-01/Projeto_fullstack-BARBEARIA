<!DOCTYPE html>
<html lang="pt-br" class="home-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senai Barbearia</title>
    <link rel="icon" href="../../img/barbershop.png" type="image/png">
    <link rel="stylesheet" href="../../CSS/style-user.css">
</head>
<body>
    <!-- CABEÇALHO -->
    <header>
        <div class="logo-container">
            <img src="../../img/Logo_escuro.png" alt="Logo Senai Barbearia">
        </div>
        
        <nav>
            <ul>
                <li><a href="../user/home.html" class="active">Início</a></li>
                <li><a href="../user/servicos.html">Serviços</a></li>
                <li><a href="../user/profissionais.html">Profissionais</a></li>
                <li><a href="../user/meus-horarios.html">Meus horários</a></li>
                <li><a href="../user/agendar.html">Agendar</a></li>
                <li><a href="../user/localizacao.html">Localização</a></li>
                <li><a href="../user/perfil.html">Perfil</a></li>
                <li><a class="btn-sair" href="../../index.html">Sair</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN -->
    <main class="container-horarios">
        <h2 class="titulo">Reserve seu horário</h2>

        <form id="form-agendamento" action="fazer_agendamento.php" method="POST" class="agendamento-flow">
            <div class="step-container">
                <label><i class="fas fa-cut"></i> Qual o serviço de hoje?</label>
                <select name="servico_id" id="servico_id" required onchange="buscarProfissionais()">
                    <option value="" disabled selected>Selecione um serviço</option>
                </select>
            </div>

            <div class="step-container" id="div-profissional" style="display:none;">
                <label>Com qual especialista?</label>
                <select name="profissional_id" id="profissional_id" required onchange="resetData()">
                    <option value="">Selecione o barbeiro</option>
                </select>
            </div>

            <div class="step-container" id="secao-calendario" style="display:none;">
                <label>Escolha uma data</label>
                <input type="date" name="data" id="data_agendamento" required onchange="buscarHorarios()">
            </div>

            <div id="secao-horarios" style="display:none;">
                <label>Escolha a hora:</label>
                <div class="grade-horarios" id="container-slots"></div>
            </div>

            <input type="hidden" name="hora" id="hora_selecionada" required>
            
            <div id="resumo-card" class="resumo-agendamento" style="display:none;">
                <p id="resumo-texto"></p>
                <button type="submit" class="btn-confirmar" id="btn-finalizar">Confirmar Reserva</button>
            </div>
        </form>
    </main>

    <!-- RODAPÉ -->
    <footer>
        <p>&copy; 2025 Senai Barbearia. Todos os direitos reservados.</p>
    </footer>

    <script>
        const API_URL = '../../backend/routes/obter_dados.php';

        document.addEventListener('DOMContentLoaded', () => {
            carregarServicos();
            // Define a data mínima como hoje
            document.getElementById('data_agendamento').min = new Date().toISOString().split('T')[0];
        });

        function carregarServicos() {
            fetch(`${API_URL}?acao=servicos`)
                .then(res => res.json())
                .then(dados => {
                    const select = document.getElementById('servico_id');
                    select.innerHTML = '<option value="">Selecione um serviço</option>';

                    // Verifica se 'dados' é de fato uma lista (Array)
                    if (Array.isArray(dados)) {
                        dados.forEach(s => {
                            const option = document.createElement('option');
                            option.value = s.id;
                            option.textContent = `${s.nome} - R$ ${parseFloat(s.preco).toFixed(2)}`;
                            select.appendChild(option);
                        });
                    }
                })
                .catch(err => console.error("Erro ao carregar serviços:", err));
        }

        function buscarProfissionais() {
            const servicoId = document.getElementById('servico_id').value;
            if (!servicoId) return;

            fetch(`../../backend/routes/obter_dados.php?acao=profissionais&servico_id=${servicoId}`)
                .then(res => res.json())
                .then(dados => {
                    const select = document.getElementById('profissional_id');
                    select.innerHTML = '<option value=\"\">Selecione um profissional</option>';

                    // VERIFICAÇÃO DE SEGURANÇA:
                    if (Array.isArray(dados)) {
                        dados.forEach(p => {
                            const option = document.createElement('option');
                            option.value = p.id;
                            option.text = p.nome;
                            select.appendChild(option);
                        });
                        document.getElementById('div-profissional').style.display = 'block';
                    } else {
                        console.error("O PHP não retornou um array:", dados);
                        alert("Erro ao carregar profissionais. Verifique o console.");
                    }
                })
                .catch(err => console.error("Erro na requisição:", err));
        }

        function buscarHorarios(){
            let data = document.getElementById("data_agendamento").value;
            fetch("agendamentos.php?data=" + data)
                    .then(res => res.json())
                    .then(dados => {

                    let select = document.getElementById("hora");
                    select.innerHTML = "";

                    // evita erro forEach
                    if(!Array.isArray(dados)){
                        console.log(dados);
                        return;
                    }

                dados.forEach(item => {
                    let option = document.createElement("option");
                    option.value = item.hora;
                    option.textContent = item.hora;
                    select.appendChild(option);
                });
            })
            .catch(erro => console.log(erro));
        }

        function selecionarHora(hora, elemento) {
            document.getElementById('hora_selecionada').value = hora;
            document.querySelectorAll('.slot-hora').forEach(b => b.classList.remove('selecionado'));
            elemento.classList.add('selecionado');
            
            const servicoNome = document.querySelector('#servico_id option:checked').text;
            const resumo = document.getElementById('resumo-card');
            document.getElementById('resumo-texto').innerHTML = `<strong>Resumo:</strong> ${servicoNome} às ${hora}`;
            resumo.style.display = 'block';
        }

        function resetData() {
            document.getElementById('data_agendamento').value = '';
            document.getElementById('secao-horarios').style.display = 'none';
            document.getElementById('resumo-card').style.display = 'none';
        }
    </script>
</body>
</html>
