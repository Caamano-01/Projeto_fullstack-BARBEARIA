<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços</title>
    <!-- icon -->
    <link rel="icon" href="../../img/barbershop.png" type="image/png">

    <!-- LINKS -->
     <!-- css --><link rel="stylesheet" href="../../CSS/style-adm.css">
    <!-- bootstrap --><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR -->
     <div class="sidebar">
        <!-- logo-->
         <div class="text-center mb-4 logo">
            <img src="../../img/Logo_escuro.png" class="img-fluid" alt="Logo">
         </div>

        <!-- nav -->
         <nav class="menu">
            <a href="dashboard_admin.html">Dashboard</a>
            <a href="servicos-adm.html" class="active">Serviços</a>
            <a href="profissionais-adm.html">Profissionais</a>
            <a href="agenda-adm.html">Serviços agendados</a>
            <a href="horarios-adm.html">Horários</a>
            <a href="../../index.html">Sair</a>
         </nav>

        <!-- usuário -->
         <div class="user-info">
            <span class="user-label">Usuário:</span>
            <span class="user-name"></span>
         </div>
     </div>

    <!-- MAIN --> 
     <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="display-5 fw-bold">Serviços</h1>
                    <p class="text-muted">Customize, adicione ou exclua serviços</p>
                </div>
                <button class="btn btn-dark btn-add-servico shadow-sm">+ Add serviço</button>
            </div>

            <div class="services-container shadow-sm p-4" id="lista-servicos">

            </div>
        </div>

        <!-- table add e edit -->
         <div class="modal fade" id="modalServico" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalTitulo">Serviço</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formServico">
                            <input type="hidden" id="servico-id">
                            <div class="mb-3">
                                <label class="form-label">Nome do Serviço</label>
                                <input type="text" class="form-control" id="servico-nome" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descrição do serviço</label>
                                <input type="text" class="form-control" id="servico-descricao" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Preço (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="servico-preco" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Duração (minutos)</label>
                                <input type="number" class="form-control" id="servico-duracao" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>










    <!-- SCRIPTS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
     <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Verificação de sessão
            fetch('../../backend/routes/session.php')
                .then(response => response.json())
                .then(data => {
                    if (data.logado) {
                        document.querySelector('.user-name').textContent = data.nome; 
                        carregarServicos();
                    } else {
                        window.location.href = "../../index.html";
                    }
                });

            const container = document.getElementById('lista-servicos');

            // Função para carregar a lista
            window.carregarServicos = function() {
                fetch('../../backend/routes/servicos.php')
                    .then(res => res.json())
                    .then(response => {
                        if (response.success) {
                            container.innerHTML = response.data.map(servico => `
                                <div class="service-card d-flex align-items-center mb-3">
                                    <div class="service-details flex-grow-1 ms-3">
                                        <h4 class="mb-1">${servico.nome}</h4>
                                        <p class="service-description mb-0">${servico.descricao || ''}</p>
                                    </div>
                                    <div class="service-info text-center me-4">
                                        <span class="d-block fw-bold fs-5">R$ ${parseFloat(servico.preco).toFixed(2).replace('.', ',')}</span>
                                        <span class="text-muted small">${servico.duracao_minutos}min</span>
                                    </div>
                                    <div class="service-actions">
                                        <button class="btn btn-edit me-2" onclick="editarServico(${servico.id}, '${servico.nome}', '${servico.descricao}', ${servico.preco}, ${servico.duracao_minutos})">Editar</button>
                                        <button class="btn btn-delete" onclick="deletarServico(${servico.id})">Excluir</button>
                                    </div>
                                </div>
                            `).join('');
                        }
                    });
            }

            // Instância do Modal do Bootstrap
            const modalElement = document.getElementById('modalServico');
            const modalBS = new bootstrap.Modal(modalElement);
            const form = document.getElementById('formServico');

            // Carregar lista inicial
            carregarServicos();

            // Função para abrir o modal (Modo Adicionar)
            document.querySelector('.btn-add-servico').addEventListener('click', () => {
                form.reset();
                document.getElementById('servico-id').value = '';
                document.getElementById('modalTitulo').innerText = 'Adicionar Novo Serviço';
                modalBS.show();
            });

            // Função para abrir o modal (Modo Editar)
            window.editarServico = function(id, nome, descricao, preco, duracao) {
                document.getElementById('servico-id').value = id;
                document.getElementById('servico-nome').value = nome;
                document.getElementById('servico-descricao').value = descricao;
                document.getElementById('servico-preco').value = preco;
                document.getElementById('servico-duracao').value = duracao;
                document.getElementById('modalTitulo').innerText = 'Editar Serviço';
                modalBS.show();
            };

            // Submissão do Formulário (AJAX)
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                
                const dados = {
                    id: document.getElementById('servico-id').value,
                    nome: document.getElementById('servico-nome').value,
                    descricao: document.getElementById('servico-descricao').value,
                    preco: document.getElementById('servico-preco').value,
                    duracao: document.getElementById('servico-duracao').value
                };

                fetch('../../backend/routes/servicos_acoes.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                })
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        modalBS.hide();
                        carregarServicos();
                    } else {
                        alert("Erro ao salvar serviço: " + res.error);
                    }
                })
                .catch(err => console.error("Erro na requisição:", err));
            });

            // Função Excluir (Mantida com confirm para segurança)
            window.deletarServico = function(id) {
                if (confirm("Deseja realmente excluir este serviço?")) {
                    fetch('../../backend/routes/servicos_acoes.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'delete', id: id })
                    })
                    .then(res => res.json())
                    .then(res => { if(res.success) carregarServicos(); });
                }
            };
        });
    </script>
</body>
</html>
