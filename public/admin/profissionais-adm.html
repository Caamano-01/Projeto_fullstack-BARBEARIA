<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissionais</title>
    <!-- icon -->
    <link rel="icon" href="../../img/barbershop.png" type="image/png">

    <!-- LINKS -->
    <!-- css --><link rel="stylesheet" href="../../CSS/style-adm.css">
    <!-- bootstrap --><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR -->
     <div class="sidebar">
        <!-- logo-->
         <div class="text-center mb-4 logo">
            <img src="../../img/Logo_escuro.png" class="img-fluid" alt="Logo">
         </div>

        <!-- nav -->
         <nav class="menu">
            <a href="dashboard_admin.html">Dashboard</a>
            <a href="servicos-adm.html">Serviços</a>
            <a href="profissionais-adm.html" class="active">Profissionais</a>
            <a href="agenda-adm.html">Serviços agendados</a>
            <a href="horarios-adm.html">Horários</a>
            <a href="../../index.html">Sair</a>
         </nav>

        <!-- usuário -->
         <div class="user-info">
            <span class="user-label">Usuário:</span>
            <span class="user-name"></span>
         </div>
     </div>

    <!-- MAIN -->
     <main class="main-content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="display-5 fw-bold">Profissionais</h1>
                    <p class="text-muted">Gestão de equipe e especialidades</p>
                </div>
                <button class="btn btn-dark px-4 shadow-sm" id="btnNovoProfissional">
                    <i class="bi bi-person-plus"></i>+ add profissional
                </button>
            </div>

            <div class="row g-2" id="lista-profissionais">
                </div>
        </div>
    </main>

    <div class="modal fade" id="modalProfissional" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitulo">Profissional</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formProfissional">
                        <input type="hidden" id="prof-id">
                        
                        <div class="mb-4 text-center">
                            <div class="img-container shadow-sm">
                                <img src="https://res.cloudinary.com/demo/image/upload/d_avatar.png/non_existent_user.png" id="img-target">
                            </div>
                            <label for="prof-foto" class="btn btn-outline-dark btn-sm">
                                <i class="bi bi-camera"></i> Alterar Foto
                            </label>
                            <input type="file" id="prof-foto" class="d-none" accept="image/*" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Nome Completo</label>
                            <input type="text" id="prof-nome" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">WhatsApp</label>
                            <input type="text" id="prof-whats" class="form-control" placeholder="(00) 00000-0000" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small">Especialidades</label>
                            <div id="lista-especialidades-check" class="p-3 border rounded bg-light" style="max-height: 150px; overflow-y: auto;">
                                </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">E-mail (Login do Profissional)</label>
                            <input type="email" id="prof-email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Senha de Acesso</label>
                            <input type="password" id="prof-senha" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2" id="btnSalvar">Salvar Profissional</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {

            /* =========================
            CONFIGURAÇÕES
            ========================== */
            const API = {
                session: '../../backend/routes/session.php',
                profissionais: '../../backend/routes/profissionais.php',
                salvar: '../../backend/routes/profissionais_acoes.php',
                servicos: '../../backend/routes/servicos.php',
                especialidades: '../../backend/routes/obter_especialidades.php',
                cloudinary: '../../backend/routes/cloudinary.php'
            };

            const imgDefault = "https://res.cloudinary.com/demo/image/upload/d_avatar.png/non_existent_user.png";

            /* =========================
            ELEMENTOS
            ========================== */
            const modalElement = document.getElementById('modalProfissional');
            const modalBS = new bootstrap.Modal(modalElement);
            const form = document.getElementById('formProfissional');
            const lista = document.getElementById('lista-profissionais');
            const containerServicos = document.getElementById('lista-especialidades-check');
            const btnSalvar = document.getElementById('btnSalvar');
            const btnNovo = document.getElementById('btnNovoProfissional');
            const passwordInput = document.getElementById('password');
            const telefoneInput = document.getElementById('prof-whats');

            /* =========================
            INICIALIZAÇÃO
            ========================== */
            init();

            async function init() {
                await verificarSessao();
                await carregarServicos();
                await carregarProfissionais();
            }

            /* =========================
            SESSÃO
            ========================== */
            async function verificarSessao() {
                try {
                    const res = await fetch(API.session);
                    const data = await res.json();

                    if (!data.logado) {
                        window.location.href = "../../index.html";
                        return;
                    }

                    document.querySelector('.user-name').textContent = data.nome;

                } catch (err) {
                    console.error("Erro sessão:", err);
                    alert("Erro ao verificar sessão.");
                }
            }

            /* =========================
            PROFISSIONAIS
            ========================== */
            async function carregarProfissionais() {
                lista.innerHTML = `<div class="text-center py-5">Carregando...</div>`;

                try {
                    const res = await fetch(API.profissionais);
                    const json = await res.json();
                    const dados = json.data || json;

                    lista.innerHTML = '';

                    if (!dados.length) {
                        lista.innerHTML = `<div class="text-center text-muted py-5">Nenhum profissional cadastrado</div>`;
                        return;
                    }

                    const fragment = document.createDocumentFragment();

                    dados.forEach(p => {
                        fragment.appendChild(criarCardProfissional(p));
                    });

                    lista.appendChild(fragment);

                } catch (err) {
                    console.error("Erro ao carregar profissionais:", err);
                    lista.innerHTML = `<div class="text-danger text-center py-5">Erro ao carregar dados</div>`;
                }
            }

            function criarCardProfissional(p) {
                const col = document.createElement('div');
                col.className = "col-12 col-sm-6 col-md-4 col-lg-3 mb-2";

                col.innerHTML = `
                    <div class="card h-150 border-0 shadow-sm p-3 text-center card-profissional">
                        <div class="img-profissional-container">
                            <img src="${p.foto_url || imgDefault}" 
                                alt="Foto de ${p.nome}"
                                onerror="this.src='${imgDefault}'">
                        </div>

                        <h6 class="fw-bold mb-1">${escapeHTML(p.nome)}</h6>
                        <p class="text-muted small mb-3">${escapeHTML(p.contato || 'Sem contato')}</p>
                        
                        <div class="mt-auto d-grid gap-2"> 
                            <button class="btn btn-dark btn-sm btn-editar">
                                Editar
                            </button>
                            <button class="btn btn-danger btn-sm" onclick="deletarProfissional(${p.id})">
                                Excluir Profissional
                            </button>
                        </div>
                    </div>
                `;

                col.querySelector('.btn-editar')
                    .addEventListener('click', () => abrirEdicao(p));
                return col;
            }

            /* =========================
            EDIÇÃO
            ========================== */
            async function abrirEdicao(prof) {

                if (!prof || !prof.id) {
                    console.error("Profissional inválido:", prof);
                    return;
                }

                form.reset();

                document.getElementById('modalTitulo').innerText = "Editar Profissional";
                document.getElementById('prof-id').value = prof.id;
                document.getElementById('prof-nome').value = prof.nome || '';
                document.getElementById('prof-whats').value = prof.contato || '';
                document.getElementById('img-target').src = prof.foto_url || imgDefault;

                await marcarEspecialidades(prof.id);

                modalBS.show();
            }


            async function marcarEspecialidades(id) {
                try {
                    const res = await fetch(`${API.especialidades}?id=${id}`);
                    const ids = await res.json();

                    document.querySelectorAll('.check-servico').forEach(cb => {
                        cb.checked = ids.includes(parseInt(cb.value));
                    });

                } catch (err) {
                    console.error("Erro especialidades:", err);
                }
            }

            /* =========================
            SERVIÇOS
            ========================== */
            async function carregarServicos() {
                try {
                    const res = await fetch(API.servicos);
                    const json = await res.json();
                    const lista = json.data || json;

                    containerServicos.innerHTML = '';

                    lista.forEach(s => {
                        const div = document.createElement('div');
                        div.className = "form-check small";

                        div.innerHTML = `
                            <input class="form-check-input check-servico" 
                                type="checkbox" 
                                value="${s.id}" 
                                id="s-${s.id}">
                            <label class="form-check-label" for="s-${s.id}">
                                ${escapeHTML(s.nome)}
                            </label>
                        `;

                        containerServicos.appendChild(div);
                    });

                } catch (err) {
                    console.error("Erro serviços:", err);
                }
            }

            /* =========================
            NOVO PROFISSIONAL
            ========================== */
            btnNovo.addEventListener('click', () => {
                form.reset();
                document.getElementById('modalTitulo').innerText = "Novo Profissional";
                document.getElementById('prof-id').value = '';
                document.getElementById('img-target').src = imgDefault;

                document.querySelectorAll('.check-servico')
                    .forEach(cb => cb.checked = false);

                modalBS.show();
            });

            /* =========================
            PREVIEW IMAGEM
            ========================== */
            document.getElementById('prof-foto').addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = ev => {
                    document.getElementById('img-target').src = ev.target.result;
                };
                reader.readAsDataURL(file);
            });

            /* =========================
            SUBMIT
            ========================== */
            form.addEventListener('submit', async e => {
                e.preventDefault();

                btnSalvar.disabled = true;
                btnSalvar.innerText = "Salvando...";

                try {
                    let fotoFinal = document.getElementById('img-target').src;
                    const file = document.getElementById('prof-foto').files[0];

                    // Upload para Cloudinary (se houver novo arquivo)
                    if (file) {
                        const fd = new FormData();
                        fd.append('foto', file);
                        const cloudRes = await fetch(API.cloudinary, { method: 'POST', body: fd });
                        const cloud = await cloudRes.json();
                        if (cloud.success) fotoFinal = cloud.url;
                    }

                    // Montagem do Payload com os IDs corretos do seu HTML
                    const payload = {
                        id: document.getElementById('prof-id').value,
                        nome: document.getElementById('prof-nome').value,
                        whatsapp: document.getElementById('prof-whats').value,
                        foto_url: fotoFinal,
                        // Campos para criar o acesso ADM (Garanta que esses IDs existam no seu Modal HTML)
                        email: document.getElementById('prof-email')?.value || '', 
                        senha: document.getElementById('prof-senha')?.value || '',
                        servicos: Array.from(document.querySelectorAll('.check-servico:checked'))
                                    .map(c => parseInt(c.value))
                    };

                    const res = await fetch(API.salvar, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await res.json();

                    if (result.success) {
                        modalBS.hide();
                        await carregarProfissionais();
                        alert("Sucesso!");
                    } else {
                        alert("Erro: " + result.error);
                    }

                } catch (err) {
                    console.error(err);
                    alert("Erro ao salvar profissional.");
                } finally {
                    btnSalvar.disabled = false;
                    btnSalvar.innerText = "Salvar Profissional";
                }
            });

            telefoneInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, "");
                if (value.length > 0) value = "(" + value;
                if (value.length > 3) value = value.slice(0, 3) + ") " + value.slice(3);
                if (value.length > 10) value = value.slice(0, 10) + "-" + value.slice(10);
                e.target.value = value;
            });

            // VALIDAÇÃO ANTES DE ENVIAR
            form.addEventListener('submit', function(event) {
                const telValue = telefoneInput.value;
                
                // Verifica se o telefone tem o tamanho correto (15 caracteres)
                if (telValue.length < 15) {
                    event.preventDefault(); // Impede o envio do formulário
                    alert('Por favor, insira o telefone completo com DDD e 9 dígitos: (XX) XXXXX-XXXX');
                    telefoneInput.focus(); // Coloca o cursor no campo de telefone
                }
            });
            
            /* =========================
            UTIL
            ========================== */
            function escapeHTML(str) {
                if (!str) return '';
                return str.replace(/[&<>"']/g, m => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m]));
            }

            /* =========================
            EXCLUIR PROFISSIONAL
            ========================== */
            window.deletarProfissional = async function(id) {
                if (confirm("Deseja realmente excluir este profissional? Esta ação não pode ser desfeita.")) {
                    try {
                        const res = await fetch('../../backend/routes/profissionais_acoes.php', {
                            method: 'DELETE', // Vamos usar o método DELETE
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ id: id })
                        });

                        const result = await res.json();

                        if (result.success) {
                            alert("Profissional excluído com sucesso!");
                            location.reload(); // Recarrega a lista
                        } else {
                            alert("Erro: " + result.error);
                        }
                    } catch (err) {
                        console.error(err);
                        alert("Erro ao tentar excluir o profissional.");
                    }
                }
            };
        });
        </script>
</body>
</html>
