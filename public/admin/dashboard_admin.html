<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <!-- icon -->
    <link rel="icon" href="../../img/barbershop.png" type="image/png">

    <!-- LINKS -->
     <!-- css --><link rel="stylesheet" href="../../CSS/style-adm.css">
    <!-- bootstrap --><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR -->
     <div class="sidebar">
        <!-- logo-->
         <div class="text-center mb-4 logo">
            <img src="../../img/Logo_escuro.png" class="img-fluid" alt="Logo">
         </div>

        <!-- nav -->
         <nav class="menu">
            <a href="dashboard_admin.html" class="active">Dashboard</a>
            <a href="servicos-adm.html">Serviços</a>
            <a href="profissionais-adm.html">Profissionais</a>
            <a href="agenda-adm.html">Serviços agendados</a>
            <a href="horarios-adm.html">Horários</a>
            <a href="../../index.html">Sair</a>
         </nav>

        <!-- usuário -->
         <div class="user-info">
            <span class="user-label">Usuário:</span>
            <span class="user-name"></span>
         </div>
     </div>

     <script>
        // verifica segurança
        fetch('../../backend/routes/verificar_adm.php')
            .then(response => response.json())
            .then(data => {
                if (!data.autorizado) {
                    alert('Acesso negado! Esta área é restrita a administradores.');
                    window.location.href = '../../index.html';
                }
            })
            .catch(error => {
                console.error('Erro na verificação:', error);
                window.location.href = '../../index.html';
        });

        document.addEventListener('DOMContentLoaded', function() {
            // Procura os dados da sessão
            fetch('../../backend/routes/session.php')
                .then(response => response.json())
                .then(data => {
                    const nameElement = document.querySelector('.user-name');
                    if (data.logado) {
                        nameElement.textContent = data.nome; 
                    } else {
                        window.location.href = "../../index.html";
                    }
                })
                .catch(error => console.error('Erro ao carregar sessão:', error));

            // marcar link ativo
            const links = document.querySelectorAll('.sidebar a');
            const current = window.location.href;
            links.forEach(link => {
                if(link.href === current){
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
