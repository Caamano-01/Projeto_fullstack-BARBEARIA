<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários</title>
    <!-- icon -->
    <link rel="icon" href="../../img/barbershop.png" type="image/png">

    <!-- LINKS -->
    <!-- css --><link rel="stylesheet" href="../../CSS/style-adm.css">
    <!-- bootstrap --><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR -->
     <div class="sidebar">
        <!-- logo-->
         <div class="text-center mb-4 logo">
            <img src="../../img/Logo_escuro.png" class="img-fluid" alt="Logo">
         </div>

        <!-- nav -->
         <nav class="menu">
            <a href="dashboard_admin.html">Dashboard</a>
            <a href="servicos-adm.html">Serviços</a>
            <a href="profissionais-adm.html">Profissionais</a>
            <a href="agenda-adm.html">Serviços agendados</a>
            <a href="horarios-adm.html" class="active">Horários</a>
            <a href="../../index.html">Sair</a>
         </nav>

        <!-- usuário -->
         <div class="user-info">
            <span class="user-label">Usuário:</span>
            <span class="user-name"></span>
         </div>
     </div>

    <!-- MAIN -->
     <main class="main-content">
        <div class="container">
            <h2 class="mb-4">Bloquear Horários</h2>
            <div class="card p-4 shadow-sm">
                <form id="form-bloqueio">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Profissional</label>
                            <select class="form-select" id="profissional_id" required>
                                </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" id="data_bloqueio" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora Início</label>
                            <input type="time" class="form-control" id="hora_inicio" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora Fim</label>
                            <input type="time" class="form-control" id="hora_fim" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Motivo (Opcional)</label>
                            <input type="text" class="form-control" id="motivo" placeholder="Ex: Feriado">
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-dark w-100">Bloquear Horário</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="mt-5">
            <h3 class="mb-3">Horários Bloqueados</h3>
            <div class="table-responsive bg-white p-3 rounded shadow-sm">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Profissional</th>
                            <th>Data</th>
                            <th>Início</th>
                            <th>Fim</th>
                            <th>Motivo</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-bloqueios">
                        </tbody>
                </table>
            </div>
        </div>
     </main>

    <!-- SCRIPTS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
     <script>
        // 1. Carregar profissionais ao abrir a página
        function carregarProfissionais() {
            fetch('../../backend/routes/profissionais.php')
                .then(res => res.json())
                .then(profissionais => {
                    const select = document.getElementById('profissional_id');
                    select.innerHTML = '<option value="">Selecione um profissional</option>';
                    profissionais.forEach(p => {
                        select.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
                    });
                });
        }

        // Enviar dados do formulário
        document.getElementById('form-bloqueio').addEventListener('submit', function(e) {
            e.preventDefault();

            const dados = {
                profissional_id: document.getElementById('profissional_id').value,
                data: document.getElementById('data_bloqueio').value,
                hora_inicio: document.getElementById('hora_inicio').value,
                hora_fim: document.getElementById('hora_fim').value,
                motivo: document.getElementById('motivo').value
            };

            fetch('../../backend/routes/meus-horarios.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('Bloqueio realizado com sucesso!');
                    location.reload();
                } else {
                    alert('Erro ao bloquear: ' + data.error);
                }
            });
        });

        function carregarBloqueios() {
            fetch('../../backend/routes/listar-bloqueios.php')
                .then(res => res.json())
                .then(bloqueios => {
                    const corpoTabela = document.getElementById('tabela-bloqueios');
                    corpoTabela.innerHTML = '';

                    bloqueios.forEach(bloqueio => {
                        // Formata a data para o padrão brasileiro (DD/MM/AAAA)
                        const dataFormatada = bloqueio.data.split('-').reverse().join('/');
                        
                        corpoTabela.innerHTML += `
                            <tr>
                                <td>${bloqueio.profissional_nome}</td>
                                <td>${dataFormatada}</td>
                                <td>${bloqueio.hora_inicio.substring(0, 5)}</td>
                                <td>${bloqueio.hora_fim.substring(0, 5)}</td>
                                <td>${bloqueio.motivo || '-'}</td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="excluirBloqueio(${bloqueio.id})">
                                        Excluir
                                    </button>
                                </td>
                            </tr>
                        `;
                    });
                });
        }

        // Chame a função quando a página carregar
        document.addEventListener('DOMContentLoaded', function() {
            carregarBloqueios();
            carregarProfissionais();
        });
     </script>
</body>
</html>
