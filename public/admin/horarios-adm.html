<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horários</title>
    <!-- icon -->
    <link rel="icon" href="../../img/barbershop.png" type="image/png">

    <!-- LINKS -->
    <!-- css --><link rel="stylesheet" href="../../CSS/style-adm.css">
    <!-- bootstrap --><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR -->
     <div class="sidebar">
        <!-- logo-->
         <div class="text-center mb-4 logo">
            <img src="../../img/Logo_escuro.png" class="img-fluid" alt="Logo">
         </div>

        <!-- nav -->
         <nav class="menu">
            <a href="dashboard_admin.html">Dashboard</a>
            <a href="servicos-adm.html">Serviços</a>
            <a href="profissionais-adm.html">Profissionais</a>
            <a href="agenda-adm.html">Serviços agendados</a>
            <a href="horarios-adm.html" class="active">Horários</a>
            <a href="../../index.html">Sair</a>
         </nav>

        <!-- usuário -->
         <div class="user-info">
            <span class="user-label">Usuário:</span>
            <span class="user-name"></span>
         </div>
     </div>

    <!-- MAIN -->
     <main class="main-content">
        <div class="container">
            <h2 class="mb-4">Bloquear Horários</h2>
            <div class="card p-4 shadow-sm">
                <form id="form-bloqueio">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Profissional</label>
                            <select class="form-select" id="profissional_id" required>
                                </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Data</label>
                            <input type="date" class="form-control" id="data_bloqueio" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora Início</label>
                            <input type="time" class="form-control" id="hora_inicio" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Hora Fim</label>
                            <input type="time" class="form-control" id="hora_fim" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Motivo (Opcional)</label>
                            <input type="text" class="form-control" id="motivo" placeholder="Ex: Feriado">
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-dark w-100">Bloquear Horário</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
     </main>

    <!-- SCRIPTS -->
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
     <script>
        // Verificação de sessão
            fetch('../../backend/routes/session.php')
                .then(response => response.json())
                .then(data => {
                    if (data.logado) {
                        document.querySelector('.user-name').textContent = data.nome; 
                        carregarServicos();
                    } else {
                        window.location.href = "../../index.html";
                    }
                });
        
        document.getElementById('form-bloqueio').addEventListener('submit', function(e) {
            e.preventDefault();

            const dados = {
                profissional_id: document.getElementById('profissional_id').value,
                data: document.getElementById('data_bloqueio').value,
                hora_inicio: document.getElementById('hora_inicio').value,
                hora_fim: document.getElementById('hora_fim').value,
                motivo: document.getElementById('motivo').value
            };

            fetch('../../backend/routes/meus-horarios.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    alert('Horário bloqueado com sucesso!');
                    location.reload();
                }
            });
        });
     </script>
</body>
</html>
